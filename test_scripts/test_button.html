<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопки</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Экран выбора папки для полного отчета -->
    <div id="full-report-folder-screen" class="screen active">
        <div class="container">
            <h2>Полный отчет за сутки</h2>
            <div class="full-report-content">
                <div class="browse-reports-section">
                    <p>Выберите папку с отчетами для формирования полного отчета:</p>
                    <button id="browse-full-report-folder-btn" class="btn btn-primary">Выбрать папку с
                        отчетами</button>
                    <button id="download-test-reports-btn" class="btn btn-outline">Скачать тестовые отчеты</button>
                    <div id="full-report-display"></div>
                </div>
            </div>
            <div class="full-report-actions">
                <button type="button" id="back-to-auth-full-report" class="btn btn-secondary">Назад</button>
                <button type="button" id="checklist-button" class="btn btn-outline">Чек-лист проверки</button>
                <button type="button" id="update-page-link" class="btn btn-outline">Информация о версии</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('download-test-reports-btn').addEventListener('click', function () {
            alert('Кнопка работает!');
        });
    </script>
</body>

</html>
